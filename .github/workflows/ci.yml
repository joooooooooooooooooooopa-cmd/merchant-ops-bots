name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  crm-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
